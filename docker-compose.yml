services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: landf_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: landf_postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migration-add-conversations.sql:/docker-entrypoint-initdb.d/02-migration-conversations.sql:ro
      - ./db/schema-auditoria-enterprise.sql:/docker-entrypoint-initdb.d/03-audit-schema.sql:ro
      - ./migrations/004_add_password_hash.sql:/docker-entrypoint-initdb.d/04-add-password-hash.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build: ./app
    container_name: landf_rag
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./rag:/app/rag
      - ./app/ingest.py:/app/ingest.py
      - ./app/query.py:/app/query.py
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: python query.py

  web:
    build: ./web
    container_name: landf_web
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://rag:rag@postgres:5432/ragdb"
      RATE_LIMIT_REQUESTS: "30"
      RATE_LIMIT_WINDOW: "60"
      MAX_FOLDER_SIZE_MB: "100"
      FOLDER_SCAN_INTERVAL_SECONDS: "300"
    volumes:
      - ./rag:/app/rag
      - ./web:/app
      - ./data:/app/data
      - ./tests:/app/tests
    ports:
      - "2468:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  datadog:
    image: gcr.io/datadoghq/agent:latest
    container_name: landf_datadog
    profiles:
      - monitoring
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_CONTAINER_EXCLUDE=name:datadog-agent
      - DD_CONTAINER_INCLUDE=*
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - "8126:8126"
    depends_on:
      - postgres
      - qdrant
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "agent health"]
      interval: 15s
      timeout: 5s
      retries: 3
