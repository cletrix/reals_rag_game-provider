services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: landf_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: landf_postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migration-add-conversations.sql:/docker-entrypoint-initdb.d/02-migration-conversations.sql:ro
      - ./db/schema-auditoria-enterprise.sql:/docker-entrypoint-initdb.d/03-audit-schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    build: ./app
    container_name: landf_rag
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./rag:/app/rag
      - ./app/ingest.py:/app/ingest.py
      - ./app/query.py:/app/query.py
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: python query.py

  web:
    build: ./web
    container_name: landf_web
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://rag:rag@postgres:5432/ragdb"
    volumes:
      - ./rag:/app/rag
      - ./web:/app
      - ./data:/app/data
    ports:
      - "2468:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
