[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -q
    --cov=web
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=60
markers =
    unit: testes unitários (sem dependências externas)
    integration: testes de integração com banco/serviços
    slow: testes lentos
