<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RAG LandF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#2563eb',
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-950 text-gray-100">

  <div class="w-full max-w-md p-8 bg-gray-900 border border-gray-800 rounded-xl shadow-2xl">
    <!-- Logo/Title -->
    <div class="flex items-center justify-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-md bg-blue-600 flex items-center justify-center text-sm font-bold">R</div>
      <span class="text-xl font-semibold tracking-wide">RAG LandF</span>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-400 mb-2">Email</label>
        <input 
          type="email" 
          id="username" 
          name="username"
          placeholder="Digite seu email"
          required
          class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-400 mb-2">Senha</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          placeholder="Digite sua senha"
          required
          class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        />
      </div>

      <button 
        type="submit" 
        id="submit-btn"
        class="w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Entrar
      </button>
    </form>

    <!-- Error Message -->
    <div id="error-message" class="hidden mt-4 p-3 bg-red-900/30 border border-red-800 rounded-lg">
      <p class="text-sm text-red-400" id="error-text"></p>
    </div>

    <!-- Success Message -->
    <div id="success-message" class="hidden mt-4 p-3 bg-green-900/30 border border-green-800 rounded-lg">
      <p class="text-sm text-green-400">Login realizado com sucesso! Redirecionando...</p>
    </div>

    <!-- Default Users Info -->
    <div class="mt-6 pt-6 border-t border-gray-800">
      <p class="text-xs text-gray-500 mb-2">Usuários de teste:</p>
      <div class="space-y-1 text-xs text-gray-400">
        <p><span class="text-gray-300">admin@empresa.com</span> / admin123</p>
        <p><span class="text-gray-300">dev1@empresa.com</span> / dev123</p>
        <p><span class="text-gray-300">dev2@empresa.com</span> / dev123</p>
        <p><span class="text-gray-300">bets1@empresa.com</span> / dev123</p>
        <p><span class="text-gray-300">rh1@empresa.com</span> / dev123</p>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const successMessage = document.getElementById('success-message');

    // Check if already logged in
    const token = localStorage.getItem('auth_token');
    if (token) {
      window.location.href = '/';
    }

    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Hide previous messages
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');
      
      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store token
          localStorage.setItem('auth_token', data.access_token);
          localStorage.setItem('user_data', JSON.stringify(data.user));
          
          // Show success message
          successMessage.classList.remove('hidden');
          
          // Redirect after short delay
          setTimeout(() => {
            window.location.href = '/';
          }, 500);
        } else {
          // Show error
          errorText.textContent = data.detail || 'Erro ao fazer login';
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Login error:', error);
        errorText.textContent = 'Erro de conexão. Tente novamente.';
        errorMessage.classList.remove('hidden');
      } finally {
        // Re-enable button
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });

    // Focus username on load
    window.onload = function() {
      document.getElementById('username').focus();
    };
  </script>

</body>
</html>
